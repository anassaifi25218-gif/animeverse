<!doctype html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin — AnimeVerse</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>

<header class="nav">
  <a class="logo" href="/">ANIME<span>VERSE</span></a>
  <a class="admin-link" href="/">View site</a>
</header>

<main class="admin-page">

  <section id="loginBox" class="panel">
    <h1>Admin Login</h1>

    <p class="muted">
      यहाँ से सिर्फ authorized admin anime upload कर सकता है.
    </p>

    <form id="loginForm">

      <input
        id="password"
        type="password"
        placeholder="Admin password"
        required
      >

      <button type="submit">Login</button>

      <p id="loginMsg" class="msg"></p>

    </form>
  </section>


  <section id="dashboard" class="panel" hidden>

    <div class="section-head">

      <h1>Upload Anime</h1>

      <button
        id="logout"
        type="button"
        class="secondary"
      >
        Logout
      </button>

    </div>


    <form id="uploadForm">

      <label>
        Anime title

        <input
          name="title"
          required
          placeholder="जैसे: My Anime"
        >
      </label>


      <label>
        Episode Number

        <input
          name="episode"
          type="number"
          min="1"
          value="1"
          required
        >
      </label>


      <label>
        Category

        <input
          name="category"
          placeholder="Action"
        >
      </label>


      <label>
        Description

        <textarea
          name="description"
          rows="4"
          placeholder="Anime के बारे में..."
        ></textarea>
      </label>


      <!-- VIDEO -->

      <div class="upload-field">

        <label>Video</label>

        <button
          type="button"
          id="videoUploadBtn"
        >
          Select Video
        </button>

        <p
          id="videoStatus"
          class="muted"
        >
          No video selected
        </p>

      </div>


      <!-- POSTER -->

      <div class="upload-field">

        <label>Poster</label>

        <button
          type="button"
          id="posterUploadBtn"
        >
          Select Poster
        </button>

        <p
          id="posterStatus"
          class="muted"
        >
          No poster selected
        </p>

      </div>


      <button
        id="saveAnimeBtn"
        type="submit"
      >
        Upload Anime
      </button>

      <p
        id="uploadMsg"
        class="msg"
      ></p>

    </form>


    <h2>Your Anime</h2>

    <div id="adminList"></div>

  </section>

</main>


<script src="https://upload-widget.cloudinary.com/global/all.js"></script>

<script src="/admin.js"></script>

</body>
</html>
