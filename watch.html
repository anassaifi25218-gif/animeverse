<!doctype html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Watch Anime</title>

  <link rel="stylesheet" href="/style.css">

  <style>
    /* ===============================
       WATCH PAGE
       =============================== */

    .watch-page {
      display: block !important;
      width: 100% !important;
      max-width: 900px !important;
      margin: 0 auto !important;
      padding: 30px 20px 60px !important;
      box-sizing: border-box !important;
    }

    .back {
      display: inline-block;
      margin-bottom: 30px;
    }

    #watch {
      display: block !important;
      width: 100% !important;
    }

    .anime-poster {
      display: block !important;
      width: 100% !important;
      max-width: 450px !important;
      margin: 0 auto 28px !important;
    }

    .anime-poster img {
      display: block !important;
      width: 100% !important;
      height: auto !important;
      max-height: 300px !important;
      object-fit: cover !important;
      border-radius: 14px !important;
    }

    .anime-title {
      display: block !important;
      width: 100% !important;
      margin: 0 0 18px !important;
      font-size: 34px !important;
      line-height: 1.25 !important;
    }

    .anime-category {
      display: inline-block !important;
      margin: 0 0 28px !important;
      padding: 10px 16px !important;
      border-radius: 12px !important;
      background: rgba(255,255,255,0.06) !important;
    }

    .anime-description {
      display: block !important;
      width: 100% !important;
      margin: 0 0 35px !important;
      font-size: 20px !important;
      line-height: 1.7 !important;
    }

    .watch-heading {
      margin: 0 0 15px !important;
      font-size: 30px !important;
    }

    #animeVideo {
      display: block !important;
      width: 100% !important;
      max-width: 900px !important;
      height: auto !important;
      min-height: 220px !important;
      background: #000 !important;
      border-radius: 14px !important;
    }

    .episodes-section {
      display: block !important;
      width: 100% !important;
      margin-top: 35px !important;
    }

    .episodes-section h2 {
      font-size: 30px !important;
      margin-bottom: 18px !important;
    }

    #episodes {
      display: flex !important;
      flex-wrap: wrap !important;
      gap: 10px !important;
    }

    .episode-btn {
      display: inline-block !important;
      padding: 12px 16px !important;
      border-radius: 10px !important;
      text-decoration: none !important;
    }

    .episode-btn.active {
      font-weight: bold !important;
    }

    @media (max-width: 600px) {

      .watch-page {
        padding: 25px 28px 50px !important;
      }

      .anime-poster {
        max-width: 450px !important;
        margin-left: auto !important;
        margin-right: auto !important;
      }

      .anime-poster img {
        width: 100% !important;
        max-height: 260px !important;
        object-fit: cover !important;
      }

      .anime-title {
        font-size: 32px !important;
      }

      .anime-description {
        font-size: 20px !important;
      }

      #animeVideo {
        width: 100% !important;
        min-height: 200px !important;
      }
    }
  </style>
</head>

<body>

<header class="nav">

  <a class="logo" href="/">
    ANIME<span>VERSE</span>
  </a>

  <a
    class="admin-link"
    href="/admin.html"
    id="adminLink"
    hidden
  >
    Admin
  </a>

</header>


<main class="watch-page">

  <a href="/" class="back">
    ← Back
  </a>


  <div id="watch"></div>


  <section class="episodes-section">

    <h2>
      📺 Episodes
    </h2>

    <div id="episodes"></div>

  </section>

</main>


<script>
(async () => {

  const id =
    new URLSearchParams(location.search).get("id");

  const watch =
    document.getElementById("watch");

  const episodes =
    document.getElementById("episodes");

  const adminLink =
    document.getElementById("adminLink");


  // Admin status
  try {

    const adminResponse =
      await fetch("/api/admin/status", {
        credentials: "same-origin",
        cache: "no-store"
      });

    if (adminResponse.ok) {

      const adminData =
        await adminResponse.json();

      adminLink.hidden =
        !adminData.isAdmin;
    }

  } catch (error) {

    console.error("ADMIN STATUS ERROR:", error);

    adminLink.hidden = true;
  }


  // Anime load
  try {

    const response =
      await fetch("/api/anime", {
        cache: "no-store"
      });

    if (!response.ok) {
      throw new Error("Anime load failed");
    }

    const list =
      await response.json();

    const anime =
      list.find(
        item =>
          String(item.id) === String(id)
      );

    if (!anime) {

      watch.innerHTML =
        "<h1>Anime नहीं मिला</h1>";

      return;
    }


    document.title =
      (anime.title || "Anime") +
      " — AnimeVerse";


    // Same title = episodes
    const sameAnime =
      list
        .filter(item =>
          String(item.title || "")
            .trim()
            .toLowerCase() ===
          String(anime.title || "")
            .trim()
            .toLowerCase()
        )
        .sort((a, b) =>
          Number(a.episode || 1) -
          Number(b.episode || 1)
        );


    // Video URL
    let videoUrl = "";

    if (typeof anime.video === "string") {

      videoUrl = anime.video;

    } else if (
      anime.video &&
      anime.video.secure_url
    ) {

      videoUrl =
        anime.video.secure_url;
    }


    // Poster URL
    let posterUrl = "";

    if (typeof anime.poster === "string") {

      posterUrl = anime.poster;

    } else if (
      anime.poster &&
      anime.poster.secure_url
    ) {

      posterUrl =
        anime.poster.secure_url;
    }


    watch.innerHTML = `

      <div class="anime-info">

        ${
          posterUrl
            ? `
              <img
                class="anime-poster"
                src="${escapeHtml(posterUrl)}"
                alt="${escapeHtml(anime.title || "Anime poster")}"
              >
            `
            : ""
        }

        <div class="anime-content">

          <h1>
            ${escapeHtml(anime.title || "Anime")}
          </h1>

          <p class="muted">
            ${escapeHtml(anime.category || "Anime")}
          </p>

          <div class="details">

            <p>
              ${escapeHtml(
                anime.description ||
                "No description available."
              )}
            </p>

          </div>

        </div>

      </div>


      <h2 class="watch-heading">
        ▶️ Watch Anime
      </h2>

      <video
        id="animeVideo"
        class="player"
        controls
        playsinline
        preload="metadata"
      ></video>

      <div class="video-buttons">

        <button
          id="previousBtn"
          type="button"
        >
          ◀ Previous
        </button>

        <button
          id="nextBtn"
          type="button"
        >
          Next ▶
        </button>

      </div>

    `;


    const videoPlayer =
      document.getElementById("animeVideo");

    if (videoPlayer && videoUrl) {

      videoPlayer.src = videoUrl;

      videoPlayer.load();
    }


    // Previous / Next
    const currentIndex =
      sameAnime.findIndex(
        item =>
          String(item.id) === String(anime.id)
      );


    const previousBtn =
      document.getElementById("previousBtn");

    const nextBtn =
      document.getElementById("nextBtn");


    if (currentIndex <= 0) {

      previousBtn.disabled = true;

    } else {

      previousBtn.disabled = false;

      previousBtn.onclick = () => {

        const previous =
          sameAnime[currentIndex - 1];

        location.href =
          "/watch.html?id=" +
          encodeURIComponent(previous.id);
      };
    }


    if (
      currentIndex === -1 ||
      currentIndex >= sameAnime.length - 1
    ) {

      nextBtn.disabled = true;

    } else {

      nextBtn.disabled = false;

      nextBtn.onclick = () => {

        const next =
          sameAnime[currentIndex + 1];

        location.href =
          "/watch.html?id=" +
          encodeURIComponent(next.id);
      };
    }


    // Episodes
    episodes.innerHTML = "";

    if (!sameAnime.length) {

      episodes.innerHTML =
        "<p class='muted'>No episodes available.</p>";

    } else {

      sameAnime.forEach(
        (ep, index) => {

          const button =
            document.createElement("a");

          button.className =
            "episode-btn";

          if (
            String(ep.id) ===
            String(anime.id)
          ) {

            button.classList.add("active");
          }

          button.href =
            "/watch.html?id=" +
            encodeURIComponent(ep.id);

          button.textContent =
            "▶ Episode " +
            Number(
              ep.episode || index + 1
            );

          episodes.appendChild(button);

        }
      );
    }


  } catch (error) {

    console.error(
      "ANIME LOAD ERROR:",
      error
    );

    watch.innerHTML =
      "<h1>Anime load नहीं हो पाया।</h1>";
  }


  function escapeHtml(s) {

    return String(s || "").replace(
      /[&<>"']/g,
      c => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[c])
    );

  }

})();
</script>

  

 
                

</body>
</html>
