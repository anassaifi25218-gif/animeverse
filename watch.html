<!doctype html>
<html lang="hi">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Watch Anime</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >

  <style>

    .watch-page {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 30px 20px 60px;
      box-sizing: border-box;
    }

    .back {
      display: inline-block;
      margin-bottom: 30px;
      color: #8b5cf6;
      text-decoration: none;
      font-size: 20px;
    }

    .anime-info {
      width: 100%;
    }

    #poster {
      display: block;
      width: 100%;
      max-width: 450px;
      height: 255px;
      object-fit: cover;
      border-radius: 16px;
      margin: 0 0 30px;
      background: #222;
    }

    #title {
      margin: 0 0 25px;
      color: #fff;
      font-size: 42px;
      line-height: 1.2;
    }

    #category {
      display: inline-block;
      padding: 10px 16px;
      margin-bottom: 30px;
      border: 1px solid #3b3d49;
      border-radius: 12px;
      background: #20222c;
      color: #ddd;
      font-size: 17px;
    }

    #description {
      margin-bottom: 45px;
      color: #ddd;
      font-size: 22px;
      line-height: 1.6;
    }

    .watch-heading {
      color: #fff;
      font-size: 32px;
      margin-bottom: 20px;
    }

    #animeVideo {
      display: block;
      width: 100%;
      max-width: 900px;
      background: #000;
      border-radius: 16px;
    }

    .episode-navigation {
      display: flex;
      gap: 15px;
      margin: 20px 0 45px;
    }

    .nav-btn {
      display: inline-block;
      padding: 14px 22px;
      background: #fff;
      color: #111;
      border-radius: 12px;
      text-decoration: none;
      font-size: 17px;
    }

    .nav-btn.disabled {
      opacity: .35;
      pointer-events: none;
    }

    .episodes-section h2 {
      color: #fff;
      font-size: 32px;
    }

    #episodes {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .episode-btn {
      padding: 12px 18px;
      border-radius: 10px;
      background: #252733;
      border: 1px solid #3b3d49;
      color: #fff;
      text-decoration: none;
    }

    .episode-btn.active {
      background: #7c3aed;
    }

    .muted {
      color: #aaa;
    }

    @media (max-width: 600px) {

      .watch-page {
        padding: 25px 28px 50px;
      }

      #poster {
        width: 100%;
        max-width: 450px;
        height: 255px;
      }

      #title {
        font-size: 38px;
      }

      #description {
        font-size: 21px;
      }

      .watch-heading {
        font-size: 31px;
      }

    }

  </style>
</head>


<body>

<header class="nav">

  <a
    class="logo"
    href="/"
  >
    ANIME<span>VERSE</span>
  </a>

</header>


<main class="watch-page">

  <a
    href="/"
    class="back"
  >
    ← Home
  </a>


  <div class="anime-info">

    <img
      id="poster"
      src=""
      alt="Anime poster"
    >

    <h1 id="title">
      Loading...
    </h1>

    <div id="category">
      Anime
    </div>

    <p id="description">
      Loading description...
    </p>

  </div>


  <section>

    <h2 class="watch-heading">
      ▶️ Watch Anime
    </h2>

    <video
      id="animeVideo"
      controls
      playsinline
      preload="metadata"
    >
    </video>


    <div class="episode-navigation">

      <a
        id="previousBtn"
        class="nav-btn disabled"
        href="#"
      >
        ◀◀ Previous
      </a>

      <a
        id="nextBtn"
        class="nav-btn disabled"
        href="#"
      >
        Next ▶▶
      </a>

    </div>

  <script>

document.addEventListener("DOMContentLoaded", async () => {

  const params =
    new URLSearchParams(location.search);

  const id =
    params.get("id");

  const epParam =
    params.get("ep");

  const title =
    document.getElementById("title");

  const category =
    document.getElementById("category");

  const description =
    document.getElementById("description");

  const poster =
    document.getElementById("poster");

  const video =
    document.getElementById("animeVideo");

  const episodeBox =
    document.getElementById("episodes");

  const empty =
    document.getElementById("empty");

  const previous =
    document.getElementById("previousBtn");

  const next =
    document.getElementById("nextBtn");


  if (!id) {

    title.textContent =
      "Anime not found";

    return;

  }


  try {

    const response =
      await fetch(
        "/api/anime?t=" + Date.now(),
        {
          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        "API error: " +
        response.status
      );

    }


    const animeList =
      await response.json();


    const anime =
      animeList.find(
        item =>
          String(item.id) === String(id)
      );


    if (!anime) {

      title.textContent =
        "Anime not found";

      return;

    }


    /* =========================
       BASIC INFO
    ========================= */

    title.textContent =
      anime.title || "Anime";

    document.title =
      (anime.title || "Anime") +
      " — AnimeVerse";

    category.textContent =
      anime.category || "Anime";

    description.textContent =
      anime.description ||
      "No description available.";


    if (anime.poster) {

      poster.src =
        anime.poster;

      poster.alt =
        anime.title ||
        "Anime poster";

    }


    /* =========================
       BUILD EPISODES
    ========================= */

    let episodeData = [];


    if (
      Array.isArray(anime.episodes) &&
      anime.episodes.length > 0
    ) {

      episodeData =
        anime.episodes.map(ep => ({

          episode:
            Number(ep.episode || 1),

          video:
            ep.video || "",

          video_public_id:
            ep.video_public_id || null

        }));

    } else {

      episodeData = [

        {

          episode:
            Number(anime.episode || 1),

          video:
            anime.video || ""

        }

      ];

    }


    episodeData.sort(
      (a, b) =>
        Number(a.episode) -
        Number(b.episode)
    );


    /* =========================
       CURRENT EPISODE
    ========================= */

    let currentIndex = 0;


    if (epParam) {

      const requestedEpisode =
        Number(epParam);

      const foundIndex =
        episodeData.findIndex(
          ep =>
            Number(ep.episode) ===
            requestedEpisode
        );

      if (foundIndex >= 0) {

        currentIndex =
          foundIndex;

      }

    } else {

      const currentEpisode =
        Number(anime.episode || 1);

      const foundIndex =
        episodeData.findIndex(
          ep =>
            Number(ep.episode) ===
            currentEpisode
        );

      if (foundIndex >= 0) {

        currentIndex =
          foundIndex;

      }

    }


    /* =========================
       PLAY EPISODE
    ========================= */

    function playEpisode(index) {

      if (
        index < 0 ||
        index >= episodeData.length
      ) {

        return;

      }


      currentIndex =
        index;


      const ep =
        episodeData[currentIndex];


      if (ep.video) {

        video.src =
          ep.video;

        video.load();

        video.play()
          .catch(() => {});

      }


      /* Active button */

      document
        .querySelectorAll(
          ".episode-btn"
        )
        .forEach(
          (btn, i) => {

            btn.classList.toggle(
              "active",
              i === currentIndex
            );

          }
        );


      /* Previous */

      if (currentIndex > 0) {

        previous.classList.remove(
          "disabled"
        );

        previous.href =
          "#";

      } else {

        previous.classList.add(
          "disabled"
        );

        previous.href =
          "#";

      }


      /* Next */

      if (
        currentIndex <
        episodeData.length - 1
      ) {

        next.classList.remove(
          "disabled"
        );

        next.href =
          "#";

      } else {

        next.classList.add(
          "disabled"
        );

        next.href =
          "#";

      }

    }


    /* =========================
       EPISODE BUTTONS
    ========================= */

    episodeBox.innerHTML = "";


    if (episodeData.length > 0) {

      empty.hidden = true;


      episodeData.forEach(
        (ep, index) => {

          const button =
            document.createElement("button");


          button.type =
            "button";


          button.className =
            "episode-btn";


          button.textContent =
            "▶ Episode " +
            ep.episode;


          button.addEventListener(
            "click",
            () => {

              playEpisode(index);

              video.scrollIntoView({
                behavior: "smooth",
                block: "center"
              });

            }
          );


          episodeBox.appendChild(
            button
          );

        }
      );


    } else {

      empty.hidden = false;

    }


    /* =========================
       PREVIOUS BUTTON
    ========================= */

    previous.addEventListener(
      "click",
      event => {

        event.preventDefault();

        if (currentIndex > 0) {

          playEpisode(
            currentIndex - 1
          );

        }

      }
    );


    /* =========================
       NEXT BUTTON
    ========================= */

    next.addEventListener(
      "click",
      event => {

        event.preventDefault();

        if (
          currentIndex <
          episodeData.length - 1
        ) {

          playEpisode(
            currentIndex + 1
          );

        }

      }
    );


    /* =========================
       FIRST VIDEO
    ========================= */

    playEpisode(
      currentIndex
    );

  } catch (error) {

    console.error(
      "WATCH ERROR:",
      error
    );

    title.textContent =
      "Anime load nahi ho paya.";

    description.textContent =
      "Data load karne me problem aa rahi hai.";

  }

});

  </script>


 
    


</body>
</html>
