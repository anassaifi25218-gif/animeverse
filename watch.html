<!doctype html>
<html lang="hi">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Watch Anime</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >

  <style>

    .watch-page {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 30px 20px 60px;
      box-sizing: border-box;
    }

    .back {
      display: inline-block;
      margin-bottom: 25px;
      color: #8b5cf6;
      text-decoration: none;
      font-size: 18px;
    }

    #title {
      margin: 0 0 12px;
      color: #fff;
      font-size: 36px;
      line-height: 1.2;
    }

    #category {
      display: inline-block;
      padding: 8px 14px;
      margin-bottom: 18px;
      border: 1px solid #3b3d49;
      border-radius: 10px;
      background: #20222c;
      color: #ddd;
    }

    #description {
      margin-bottom: 30px;
      color: #ddd;
      font-size: 18px;
      line-height: 1.6;
    }

    .watch-heading {
      color: #fff;
      font-size: 28px;
      margin-bottom: 15px;
    }

    #animeVideo {
      display: block;
      width: 100%;
      max-width: 900px;
      background: #000;
      border-radius: 14px;
    }

    .episode-navigation {
      display: flex;
      gap: 12px;
      margin: 18px 0 35px;
    }

    .nav-btn {
      display: inline-block;
      padding: 12px 18px;
      background: #252733;
      color: #fff;
      border: 1px solid #3b3d49;
      border-radius: 10px;
      text-decoration: none;
    }

    .nav-btn.disabled {
      opacity: .35;
      pointer-events: none;
    }

    .episodes-section h2 {
      color: #fff;
      font-size: 28px;
      margin-bottom: 15px;
    }

    #episodes {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .episode-btn {
      display: inline-block;
      padding: 12px 18px;
      border-radius: 10px;
      background: #252733;
      border: 1px solid #3b3d49;
      color: #fff;
      text-decoration: none;
    }

    .episode-btn.active {
      background: #7c3aed;
    }

    .muted {
      color: #aaa;
    }

    @media (max-width: 600px) {

      .watch-page {
        padding: 25px 18px 50px;
      }

      #title {
        font-size: 30px;
      }

      #description {
        font-size: 17px;
      }

    }

  </style>
</head>


<body>

<header class="nav">

  <a
    class="logo"
    href="/"
  >
    ANIME<span>VERSE</span>
  </a>

</header>


<main class="watch-page">

  <a
    href="/"
    class="back"
  >
    ← Home
  </a>


  <h1 id="title">
    Loading...
  </h1>


  <div id="category">
    Anime
  </div>


  <p id="description">
    Loading description...
  </p>


  <section>

    <h2 class="watch-heading">
      ▶️ Watch Anime
    </h2>


    <video
      id="animeVideo"
      controls
      playsinline
      preload="metadata"
    >
    </video>


    <div class="episode-navigation">

      <a
        id="previousBtn"
        class="nav-btn disabled"
        href="#"
      >
        ◀◀ Previous
      </a>


      <a
        id="nextBtn"
        class="nav-btn disabled"
        href="#"
      >
        Next ▶▶
      </a>

    </div>

  </section>


  <section class="episodes-section">

    <h2>
      📺 Episodes
    </h2>


    <div id="episodes"></div>


    <p
      id="empty"
      class="muted"
      hidden
    >
      Episodes available nahi hain.
    </p>

  </section>

</main>


<script>

document.addEventListener(
  "DOMContentLoaded",
  async function () {

    const params =
      new URLSearchParams(
        window.location.search
      );


    const id =
      params.get("id");


    const title =
      document.getElementById("title");


    const category =
      document.getElementById("category");


    const description =
      document.getElementById("description");


    const video =
      document.getElementById("animeVideo");


    const episodeBox =
      document.getElementById("episodes");


    const empty =
      document.getElementById("empty");


    const previous =
      document.getElementById("previousBtn");


    const next =
      document.getElementById("nextBtn");


    if (!id) {

      title.textContent =
        "Anime not found";

      return;

    }


    try {

      const response =
        await fetch(
          "/api/anime?_" +
          Date.now(),
          {
            cache: "no-store"
          }
        );


      if (!response.ok) {

        throw new Error(
          "API error: " +
          response.status
        );

      }


      const animeList =
        await response.json();


      if (!Array.isArray(animeList)) {

        throw new Error(
          "Invalid anime data"
        );

      }


      /*
       * Current anime record
       */

      const anime =
        animeList.find(
          function (item) {

            return String(item.id) ===
              String(id);

          }
        );


      if (!anime) {

        title.textContent =
          "Anime not found";

        return;

      }


      /*
       * BASIC INFORMATION
       */

      title.textContent =
        anime.title ||
        "Anime";


      document.title =
        (anime.title || "Anime") +
        " — AnimeVerse";


      category.textContent =
        anime.category ||
        "Anime";


      description.textContent =
        anime.description ||
        "No description available.";


      /*
       * EPISODES
       *
       * Server अब episodes array में
       * सभी episodes रख रहा है.
       */

      let episodeData = [];


      if (
        Array.isArray(
          anime.episodes
        )
      ) {

        episodeData =
          anime.episodes.map(
            function (ep) {

              return {

                episode:
                  Number(
                    ep.episode || 1
                  ),

                video:
                  ep.video || "",

                video_public_id:
                  ep.video_public_id ||
                  null

              };

            }
          );

      }


      /*
       * पुराने data के लिए fallback
       */

      if (
        episodeData.length === 0 &&
        anime.video
      ) {

        episodeData = [

          {

            episode:
              Number(
                anime.episode || 1
              ),

            video:
              anime.video,

            video_public_id:
              anime.video_public_id ||
              null

          }

        ];

      }


      /*
       * Episode number के हिसाब से sort
       */

      episodeData.sort(
        function (a, b) {

          return (
            Number(a.episode || 0) -
            Number(b.episode || 0)
          );

        }
      );


      /*
       * Current episode
       */

      let currentEpisode =
        Number(
          anime.episode || 1
        );


      /*
       * अगर current episode
       * episodes array में है तो
       * उसका index निकालो.
       */

      let currentIndex =
        episodeData.findIndex(
          function (ep) {

            return Number(
              ep.episode
            ) === currentEpisode;

          }
        );


      /*
       * अगर नहीं मिला तो पहला episode
       */

      if (currentIndex === -1) {

        currentIndex = 0;

      }


      /*
       * VIDEO
       */

      let currentVideo =
        anime.video || "";


      if (
        episodeData[currentIndex] &&
        episodeData[currentIndex].video
      ) {

        currentVideo =
          episodeData[currentIndex].video;

      }


      if (currentVideo) {

        video.src =
          currentVideo;

        video.load();

      } else {

        video.removeAttribute("src");

        video.load();

      }


      /*
       * EPISODE BUTTONS
       */

      episodeBox.innerHTML = "";


      if (
        episodeData.length > 0
      ) {

        empty.hidden = true;


        episodeData.forEach(
          function (ep, index) {

            const button =
              document.createElement("a");


            button.className =
              "episode-btn";


            if (
              index === currentIndex
            ) {

              button.classList.add(
                "active"
              );

            }


            button.href =
              "#";


            button.textContent =
              "▶ Episode " +
              ep.episode;


            button.addEventListener(
              "click",
              function (event) {

                event.preventDefault();


                /*
                 * Video बदलो
                 */

                if (ep.video) {

                  video.src =
                    ep.video;

                  video.load();


                  video.play()
                    .catch(
                      function () {}
                    );

                }


                /*
                 * Active button
                 */

                document
                  .querySelectorAll(
                    ".episode-btn"
                  )
                  .forEach(
                    function (btn) {

                      btn.classList.remove(
                        "active"
                      );

                    }
                  );


                button.classList.add(
                  "active"
                );


                /*
                 * Previous / Next
                 */

                currentIndex =
                  index;


                updateNavigation();


                window.scrollTo({
                  top: 0,
                  behavior: "smooth"
                });

              }
            );


            episodeBox.appendChild(
              button
            );

          }
        );


      } else {

        empty.hidden = false;

      }


      /*
       * PREVIOUS / NEXT
       */

      function updateNavigation() {

        previous.classList.add(
          "disabled"
        );

        next.classList.add(
          "disabled"
        );


        previous.removeAttribute(
          "href"
        );

        next.removeAttribute(
          "href"
        );


        /*
         * Previous
         */

        if (
          currentIndex > 0
        ) {

          previous.classList.remove(
            "disabled"
          );

          previous.href =
            "#";


          previous.onclick =
            function (event) {

              event.preventDefault();


              const ep =
                episodeData[
                  currentIndex - 1
                ];


              if (!ep) return;


              currentIndex--;


              video.src =
                ep.video;


              video.load();


              video.play()
                .catch(
                  function () {}
                );


              updateActiveEpisode();

              updateNavigation();

            };

        }


        /*
         * Next
         */

        if (
          currentIndex <
          episodeData.length - 1
        ) {

          next.classList.remove(
            "disabled"
          );

          next.href =
            "#";


          next.onclick =
            function (event) {

              event.preventDefault();


              const ep =
                episodeData[
                  currentIndex + 1
                ];


              if (!ep) return;


              currentIndex++;


              video.src =
                ep.video;


              video.load();


              video.play()
                .catch(
                  function () {}
                );


              updateActiveEpisode();

              updateNavigation();

            };

        }

      }


      /*
       * Active episode button update
       */

      function updateActiveEpisode() {

        const buttons =
          episodeBox.querySelectorAll(
            ".episode-btn"
          );


        buttons.forEach(
          function (btn, index) {

            btn.classList.toggle(
              "active",
              index === currentIndex
            );

          }
        );

      }


      updateNavigation();


    } catch (error) {

      console.error(
        "WATCH ERROR:",
        error
      );


      title.textContent =
        "Anime load nahi ho paya.";


      description.textContent =
        "Data load karne me problem aa rahi hai.";

    }

  }
);

</script>

</body>
</html>
