<!doctype html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Watch Anime</title>

  <link rel="stylesheet" href="/style.css">

  <style>
    /* =========================
       WATCH PAGE
    ========================= */

    .watch-page {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 35px 20px 60px;
      box-sizing: border-box;
    }

    .back {
      display: inline-block;
      margin-bottom: 35px;
      color: #8b5cf6;
      text-decoration: none;
      font-size: 20px;
    }

    /* Poster + information */
    .anime-info {
      display: block;
      width: 100%;
    }

    .poster {
      display: block;
      width: 100%;
      max-width: 450px;
      height: 255px;
      object-fit: cover;
      margin: 0 auto 30px;
      border-radius: 16px;
      background: #222;
    }

    .anime-title {
      margin: 0 0 25px;
      font-size: 42px;
      line-height: 1.2;
      color: #fff;
    }

    .category {
      display: inline-block;
      padding: 10px 16px;
      margin-bottom: 35px;
      border: 1px solid #3b3d49;
      border-radius: 12px;
      background: #20222c;
      color: #ddd;
      font-size: 17px;
    }

    .description {
      margin: 0 0 45px;
      color: #ddd;
      font-size: 22px;
      line-height: 1.7;
    }

    /* =========================
       VIDEO
    ========================= */

    .watch-heading {
      margin: 0 0 20px;
      font-size: 32px;
      color: #fff;
    }

    .video-wrapper {
      width: 100%;
      margin-bottom: 25px;
    }

    #animeVideo {
      display: block;
      width: 100%;
      max-width: 900px;
      height: auto;
      min-height: 200px;
      background: #000;
      border-radius: 16px;
    }

    /* =========================
       PREVIOUS / NEXT
    ========================= */

    .episode-navigation {
      display: flex;
      gap: 15px;
      margin: 20px 0 50px;
    }

    .nav-btn {
      display: inline-block;
      padding: 14px 22px;
      border-radius: 12px;
      background: #fff;
      color: #111;
      text-decoration: none;
      font-size: 17px;
      border: none;
    }

    .nav-btn.disabled {
      opacity: 0.35;
      pointer-events: none;
    }

    /* =========================
       EPISODES
    ========================= */

    .episodes-section h2 {
      margin: 0 0 20px;
      font-size: 32px;
      color: #fff;
    }

    #episodes {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .episode-btn {
      display: inline-block;
      padding: 12px 18px;
      border-radius: 10px;
      background: #252733;
      border: 1px solid #3b3d49;
      color: #fff;
      text-decoration: none;
      font-size: 16px;
    }

    .episode-btn.active {
      background: #7c3aed;
      border-color: #7c3aed;
    }

    .muted {
      color: #aaa;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .watch-page {
        padding: 25px 28px 50px;
      }

      .back {
        margin-bottom: 35px;
        font-size: 19px;
      }

      .poster {
        width: 100%;
        max-width: 450px;
        height: 255px;
        margin-bottom: 30px;
      }

      .anime-title {
        font-size: 38px;
        line-height: 1.25;
      }

      .category {
        font-size: 16px;
        margin-bottom: 30px;
      }

      .description {
        font-size: 21px;
        line-height: 1.65;
      }

      .watch-heading {
        font-size: 31px;
      }

      #animeVideo {
        width: 100%;
        min-height: 200px;
      }

      .episode-navigation {
        gap: 15px;
      }

      .nav-btn {
        padding: 14px 20px;
        font-size: 16px;
      }

      .episodes-section h2 {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

<header class="nav">

  <a class="logo" href="/">
    ANIME<span>VERSE</span>
  </a>

  <a
    class="admin-link"
    href="/admin.html"
    id="adminLink"
    hidden
  >
    Admin
  </a>

</header>


<main class="watch-page">

  <a href="/" class="back">
    ← Home
  </a>


  <div id="watch">

    <div class="anime-info">

      <img
        id="poster"
        class="poster"
        src=""
        alt="Anime poster"
      >

      <h1
        id="title"
        class="anime-title"
      >
        Loading...
      </h1>

      <div
        id="category"
        class="category"
      >
        Anime
      </div>

      <p
        id="description"
        class="description"
      >
        Loading description...
      </p>

    </div>


    <section class="video-section">

      <h2 class="watch-heading">
        ▶️ Watch Anime
      </h2>

      <div class="video-wrapper">

        <video
          id="animeVideo"
          controls
          playsinline
          preload="metadata"
        >
          Your browser does not support video.
        </video>

      </div>


      <div class="episode-navigation">

        <a
          id="previousBtn"
          class="nav-btn disabled"
          href="#"
        >
          ◀◀ Previous
        </a>

        <a
          id="nextBtn"
          class="nav-btn disabled"
          href="#"
        >
          Next ▶▶
        </a>

      </div>

    </section>

  </div>


  <section class="episodes-section">

    <h2>
      📺 Episodes
    </h2>

    <div id="episodes"></div>

    <p
      id="empty"
      class="muted"
      hidden
    >
      Episodes available nahi hain.
    </p>

  </section>

</main>


<script>

(async () => {

  const params =
    new URLSearchParams(
      location.search
    );

  const id =
    params.get("id");


  const title =
    document.getElementById("title");

  const category =
    document.getElementById("category");

  const description =
    document.getElementById("description");

  const poster =
    document.getElementById("poster");

  const videoPlayer =
    document.getElementById("animeVideo");

  const episodeList =
    document.getElementById("episodes");

  const empty =
    document.getElementById("empty");

  const previousBtn =
    document.getElementById("previousBtn");

  const nextBtn =
    document.getElementById("nextBtn");

  const adminLink =
    document.getElementById("adminLink");


  /* =========================
     ADMIN STATUS
  ========================= */

  try {

    const adminResponse =
      await fetch(
        "/api/admin/status",
        {
          credentials: "same-origin",
          cache: "no-store"
        }
      );

    if (adminResponse.ok) {

      const adminData =
        await adminResponse.json();

      adminLink.hidden =
        !adminData.isAdmin;

    }

  } catch (error) {

    console.error(
      "ADMIN STATUS ERROR:",
      error
    );

    adminLink.hidden = true;

  }


  /* =========================
     CHECK ID
  ========================= */

  if (!id) {

    title.textContent =
      "Anime not found";

    return;

  }


  /* =========================
     LOAD ANIME
  ========================= */

  try {

    const response =
      await fetch(
        "/api/anime",
        {
          cache: "no-store"
        }
      );

    if (!response.ok) {

      throw new Error(
        "Failed to load anime"
      );

    }


    const animeList =
      await response.json();


    const anime =
      animeList.find(
        item =>
          String(item.id) ===
          String(id)
      );


    if (!anime) {

      title.textContent =
        "Anime not found";

      return;

    }


    /* =========================
       BASIC DETAILS
    ========================= */

    document.title =
      (anime.title || "Anime") +
      " — AnimeVerse";


    title.textContent =
      anime.title ||
      "Anime";


    category.textContent =
      anime.category ||
      "Anime";


    description.textContent =
      anime.description ||
      "No description available.";


    /* =========================
       POSTER
    ========================= */

    if (anime.poster) {

      poster.src =
        anime.poster;

      poster.style.display =
        "block";

    } else {

      poster.style.display =
        "none";

    }


    /* =========================
       VIDEO
    ========================= */

    if (anime.video) {

      videoPlayer.src =
        anime.video;

      videoPlayer.load();

    } else {

      console.error(
        "Video URL missing"
      );

    }


    /* =========================
       FIND EPISODES
    ========================= */

    let episodeListData =
      animeList
        .filter(item => {

          return String(item.title || "")
            .trim()
            .toLowerCase() ===
            String(anime.title || "")
              .trim()
              .toLowerCase();

        });


    /* Sort episodes */

    episodeListData.sort(
      (a, b) => {

        const epA =
          Number(
            a.episode || a.id || 0
          );

        const epB =
          Number(
            b.episode || b.id || 0
          );

        return epA - epB;

      }
    );


    /* =========================
       EPISODE BUTTONS
    ========================= */

    if (
      episodeListData.length === 0
    ) {

      empty.hidden = false;

    } else {

      empty.hidden = true;


      episodeList.innerHTML =
        episodeListData
          .map((ep, index) => {

            const episodeNumber =
              ep.episode ||
              (index + 1);


            const active =
              String(ep.id) ===
              String(anime.id);


            return `
              <a
                class="episode-btn ${
                  active ? "active" : ""
                }"
                href="/watch.html?id=${encodeURIComponent(ep.id)}"
              >
                ▶ Episode ${episodeNumber}
              </a>
            `;

          })
          .join("");

    }


    /* =========================
       PREVIOUS / NEXT
    ========================= */

    const currentIndex =
      episodeListData.findIndex(
        ep =>
          String(ep.id) ===
          String(anime.id)
      );


    if (
      currentIndex > 0
    ) {

      const previousEpisode =
        episodeListData[
          currentIndex - 1
        ];

      previousBtn.href =
        "/watch.html?id=" +
        encodeURIComponent(
          previousEpisode.id
        );

      previousBtn.classList.remove(
        "disabled"
      );

    }


    if (
      currentIndex >= 0 &&
      currentIndex <
        episodeListData.length - 1
    ) {

      const nextEpisode =
        episodeListData[
          currentIndex + 1
        ];

      nextBtn.href =
        "/watch.html?id=" +
        encodeURIComponent(
          nextEpisode.id
        );

      nextBtn.classList.remove(
        "disabled"
      );

    }


  } catch (error) {

    console.error(
      "WATCH PAGE ERROR:",
      error
    );

    title.textContent =
      "Anime load nahi ho paya.";

  }

})();

</script>

</body>
</html>
