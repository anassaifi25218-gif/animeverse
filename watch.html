<!doctype html>
<html lang="hi">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Watch Anime</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >

  <style>

    .watch-page {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 30px 20px 60px;
      box-sizing: border-box;
    }

    .back {
      display: inline-block;
      margin-bottom: 30px;
      color: #8b5cf6;
      text-decoration: none;
      font-size: 20px;
    }

    .anime-info {
      width: 100%;
    }

    #poster {
      display: block;
      width: 100%;
      max-width: 450px;
      height: 255px;
      object-fit: cover;
      border-radius: 16px;
      margin: 0 0 30px;
      background: #222;
    }

    #title {
      margin: 0 0 25px;
      color: #fff;
      font-size: 42px;
      line-height: 1.2;
    }

    #category {
      display: inline-block;
      padding: 10px 16px;
      margin-bottom: 30px;
      border: 1px solid #3b3d49;
      border-radius: 12px;
      background: #20222c;
      color: #ddd;
      font-size: 17px;
    }

    #description {
      margin-bottom: 45px;
      color: #ddd;
      font-size: 22px;
      line-height: 1.6;
    }

    .watch-heading {
      color: #fff;
      font-size: 32px;
      margin-bottom: 20px;
    }

    #animeVideo {
      display: block;
      width: 100%;
      max-width: 900px;
      background: #000;
      border-radius: 16px;
    }

    .episode-navigation {
      display: flex;
      gap: 15px;
      margin: 20px 0 45px;
    }

    .nav-btn {
      display: inline-block;
      padding: 14px 22px;
      background: #fff;
      color: #111;
      border-radius: 12px;
      text-decoration: none;
      font-size: 17px;
    }

    .nav-btn.disabled {
      opacity: .35;
      pointer-events: none;
    }

    .episodes-section h2 {
      color: #fff;
      font-size: 32px;
    }

    #episodes {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .episode-btn {
      padding: 12px 18px;
      border-radius: 10px;
      background: #252733;
      border: 1px solid #3b3d49;
      color: #fff;
      text-decoration: none;
    }

    .episode-btn.active {
      background: #7c3aed;
    }

    .muted {
      color: #aaa;
    }

    @media (max-width: 600px) {

      .watch-page {
        padding: 25px 28px 50px;
      }

      #poster {
        width: 100%;
        max-width: 450px;
        height: 255px;
      }

      #title {
        font-size: 38px;
      }

      #description {
        font-size: 21px;
      }

      .watch-heading {
        font-size: 31px;
      }

    }

  </style>
</head>


<body>

<header class="nav">

  <a
    class="logo"
    href="/"
  >
    ANIME<span>VERSE</span>
  </a>

</header>


<main class="watch-page">

  <a
    href="/"
    class="back"
  >
    ← Home
  </a>


  <div class="anime-info">

    <img
      id="poster"
      src=""
      alt="Anime poster"
    >

    <h1 id="title">
      Loading...
    </h1>

    <div id="category">
      Anime
    </div>

    <p id="description">
      Loading description...
    </p>

  </div>


  <section>

    <h2 class="watch-heading">
      ▶️ Watch Anime
    </h2>

    <video
      id="animeVideo"
      controls
      playsinline
      preload="metadata"
    >
    </video>


    <div class="episode-navigation">

      <a
        id="previousBtn"
        class="nav-btn disabled"
        href="#"
      >
        ◀◀ Previous
      </a>

      <a
        id="nextBtn"
        class="nav-btn disabled"
        href="#"
      >
        Next ▶▶
      </a>

    </div>

  </section>


  <section class="episodes-section">

    <h2>
      📺 Episodes
    </h2>

    <div id="episodes"></div>

    <p
      id="empty"
      class="muted"
      hidden
    >
      Episodes available nahi hain.
    </p>

  </section>

</main>



<script>
document.addEventListener("DOMContentLoaded", async () => {

  const id = new URLSearchParams(location.search).get("id");

  const title = document.getElementById("title");
  const category = document.getElementById("category");
  const description = document.getElementById("description");
  const poster = document.getElementById("poster");
  const video = document.getElementById("animeVideo");
  const episodeBox = document.getElementById("episodes");
  const empty = document.getElementById("empty");
  const previous = document.getElementById("previousBtn");
  const next = document.getElementById("nextBtn");

  if (!id) {
    title.textContent = "Anime not found";
    return;
  }

  try {

    const response = await fetch("/api/anime", {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("API Error: " + response.status);
    }

    const animeList = await response.json();

    console.log("ANIME DATA:", animeList);

    if (!Array.isArray(animeList)) {
      throw new Error("Anime data is not an array");
    }

    const anime = animeList.find(
      item => String(item.id) === String(id)
    );

    if (!anime) {
      title.textContent = "Anime not found";
      description.textContent = "ID: " + id;
      return;
    }

    /* TITLE */
    title.textContent = anime.title || "Anime";

    document.title =
      (anime.title || "Anime") + " — AnimeVerse";

    /* CATEGORY */
    category.textContent =
      anime.category || "Anime";

    /* DESCRIPTION */
    description.textContent =
      anime.description ||
      "No description available.";

    /* POSTER */
    if (anime.poster) {
      poster.src = anime.poster;
      poster.alt = anime.title || "Anime poster";
    } else {
      poster.removeAttribute("src");
    }

    /* VIDEO */
    if (anime.video) {
      video.src = anime.video;
      video.load();
    }

    /*
      EPISODES
      Existing anime ke nested episodes ko bhi support karega
    */

    let episodeData = [];

    if (Array.isArray(anime.episodes) &&
        anime.episodes.length > 0) {

      episodeData = anime.episodes.map(ep => ({
        id: anime.id,
        title: anime.title,
        episode: ep.episode,
        video: ep.video
      }));

    } else {

      episodeData = animeList.filter(item =>
        String(item.title || "")
          .trim()
          .toLowerCase() ===
        String(anime.title || "")
          .trim()
          .toLowerCase()
      );

    }

    episodeData.sort((a, b) =>
      Number(a.episode || 0) -
      Number(b.episode || 0)
    );

    /* EPISODES */
    if (episodeData.length > 0) {

      empty.hidden = true;

      episodeBox.innerHTML =
        episodeData.map((ep, index) => {

          const number =
            ep.episode || index + 1;

          const active =
            String(ep.id) === String(anime.id) &&
            String(ep.episode || "") ===
            String(anime.episode || "");

          return `
            <a
              class="episode-btn ${active ? "active" : ""}"
              href="/watch.html?id=${encodeURIComponent(ep.id)}"
            >
              ▶ Episode ${number}
            </a>
          `;

        }).join("");

    } else {

      empty.hidden = false;
      episodeBox.innerHTML = "";

    }

    /* PREVIOUS */
    const current = episodeData.findIndex(ep =>
      String(ep.id) === String(anime.id) &&
      String(ep.episode || "") ===
      String(anime.episode || "")
    );

    if (current > 0) {

      previous.href =
        "/watch.html?id=" +
        encodeURIComponent(
          episodeData[current - 1].id
        );

      previous.classList.remove("disabled");
    }

    /* NEXT */
    if (
      current >= 0 &&
      current < episodeData.length - 1
    ) {

      next.href =
        "/watch.html?id=" +
        encodeURIComponent(
          episodeData[current + 1].id
        );

      next.classList.remove("disabled");
    }

  } catch (error) {

    console.error("WATCH ERROR:", error);

    title.textContent =
      "Anime load nahi ho paya.";

    description.textContent =
      "Data load karne me problem aa rahi hai.";

  }

});
</script>

</body>
</html>
