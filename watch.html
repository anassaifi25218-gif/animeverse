<!doctype html>
<html lang="hi">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Watch Anime</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >

  <style>

    .watch-page {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 30px 20px 60px;
      box-sizing: border-box;
    }

    .back {
      display: inline-block;
      margin-bottom: 30px;
      color: #8b5cf6;
      text-decoration: none;
      font-size: 20px;
    }

    .anime-info {
      width: 100%;
    }

    #poster {
      display: block;
      width: 100%;
      max-width: 450px;
      height: 255px;
      object-fit: cover;
      border-radius: 16px;
      margin: 0 0 30px;
      background: #222;
    }

    #title {
      margin: 0 0 25px;
      color: #fff;
      font-size: 42px;
      line-height: 1.2;
    }

    #category {
      display: inline-block;
      padding: 10px 16px;
      margin-bottom: 30px;
      border: 1px solid #3b3d49;
      border-radius: 12px;
      background: #20222c;
      color: #ddd;
      font-size: 17px;
    }

    #description {
      margin-bottom: 45px;
      color: #ddd;
      font-size: 22px;
      line-height: 1.6;
    }

    .watch-heading {
      color: #fff;
      font-size: 32px;
      margin-bottom: 20px;
    }

    #animeVideo {
      display: block;
      width: 100%;
      max-width: 900px;
      background: #000;
      border-radius: 16px;
    }

    .episode-navigation {
      display: flex;
      gap: 15px;
      margin: 20px 0 45px;
    }

    .nav-btn {
      display: inline-block;
      padding: 14px 22px;
      background: #fff;
      color: #111;
      border-radius: 12px;
      text-decoration: none;
      font-size: 17px;
    }

    .nav-btn.disabled {
      opacity: .35;
      pointer-events: none;
    }

    .episodes-section h2 {
      color: #fff;
      font-size: 32px;
    }

    #episodes {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .episode-btn {
      padding: 12px 18px;
      border-radius: 10px;
      background: #252733;
      border: 1px solid #3b3d49;
      color: #fff;
      text-decoration: none;
    }

    .episode-btn.active {
      background: #7c3aed;
    }

    .muted {
      color: #aaa;
    }

    @media (max-width: 600px) {

      .watch-page {
        padding: 25px 28px 50px;
      }

      #poster {
        width: 100%;
        max-width: 450px;
        height: 255px;
      }

      #title {
        font-size: 38px;
      }

      #description {
        font-size: 21px;
      }

      .watch-heading {
        font-size: 31px;
      }

    }

  </style>
</head>


<body>

<header class="nav">

  <a
    class="logo"
    href="/"
  >
    ANIME<span>VERSE</span>
  </a>

</header>


<main class="watch-page">

  <a
    href="/"
    class="back"
  >
    ← Home
  </a>


  <div class="anime-info">

    <img
      id="poster"
      src=""
      alt="Anime poster"
    >

    <h1 id="title">
      Loading...
    </h1>

    <div id="category">
      Anime
    </div>

    <p id="description">
      Loading description...
    </p>

  </div>


  <section>

    <h2 class="watch-heading">
      ▶️ Watch Anime
    </h2>

    <video
      id="animeVideo"
      controls
      playsinline
      preload="metadata"
    >
    </video>


    <div class="episode-navigation">

      <a
        id="previousBtn"
        class="nav-btn disabled"
        href="#"
      >
        ◀◀ Previous
      </a>

      <a
        id="nextBtn"
        class="nav-btn disabled"
        href="#"
      >
        Next ▶▶
      </a>

    </div>

  </section>


  <section class="episodes-section">

    <h2>
      📺 Episodes
    </h2>

    <div id="episodes"></div>

    <p
      id="empty"
      class="muted"
      hidden
    >
      Episodes available nahi hain.
    </p>

  <script>
(async function () {

  const id = new URLSearchParams(location.search).get("id");

  const title = document.getElementById("title");
  const category = document.getElementById("category");
  const description = document.getElementById("description");
  const poster = document.getElementById("poster");
  const video = document.getElementById("animeVideo");
  const episodeBox = document.getElementById("episodes");
  const empty = document.getElementById("empty");

  if (!id) {
    title.textContent = "Anime not found";
    return;
  }

  try {

    const response = await fetch(
      "/api/anime?t=" + Date.now(),
      {
        cache: "no-store"
      }
    );

    if (!response.ok) {
      throw new Error("API error " + response.status);
    }

    const list = await response.json();

    const anime = list.find(
      item => String(item.id) === String(id)
    );

    if (!anime) {
      title.textContent = "Anime not found";
      description.textContent = "Anime ID: " + id;
      return;
    }

    /* TITLE */
    title.textContent = anime.title || "Anime";

    document.title =
      (anime.title || "Anime") + " — AnimeVerse";

    /* CATEGORY */
    category.textContent =
      anime.category || "Anime";

    /* DESCRIPTION */
    description.textContent =
      anime.description ||
      "No description available.";

    /* POSTER */
    if (anime.poster) {
      poster.src = anime.poster;
      poster.alt = anime.title || "Anime poster";
    }

    /* VIDEO */
    if (anime.video) {
      video.src = anime.video;
      video.load();
    }

    /* EPISODES */
    let episodes = [];

    if (
      Array.isArray(anime.episodes) &&
      anime.episodes.length
    ) {

      episodes = anime.episodes.map(ep => ({
        id: anime.id,
        episode: ep.episode,
        video: ep.video
      }));

    } else {

      episodes = list.filter(item =>
        String(item.title || "").trim().toLowerCase() ===
        String(anime.title || "").trim().toLowerCase()
      );

    }

    episodes.sort(
      (a, b) =>
        Number(a.episode || 0) -
        Number(b.episode || 0)
    );

    episodeBox.innerHTML = "";

    if (episodes.length) {

      empty.hidden = true;

      episodes.forEach((ep, index) => {

        const btn = document.createElement("a");

        btn.className = "episode-btn";

        btn.href =
          "/watch.html?id=" +
          encodeURIComponent(ep.id);

        btn.textContent =
          "▶ Episode " +
          (ep.episode || index + 1);

        episodeBox.appendChild(btn);

      });

    } else {

      empty.hidden = false;

    }

  } catch (error) {

    console.error("WATCH ERROR:", error);

    title.textContent =
      "Anime load nahi ho paya.";

    description.textContent =
      "API se data load nahi ho raha.";

  }

})();
  </script>



</body>
</html>
